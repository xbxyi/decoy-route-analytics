<title>Decoy Film Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: broadcast field — team strip on top, narrow roster rail left, wide profile right; field film beside the play list. */
:root {
  --bg: #eaefeb; --surface: #f7f9f7; --ink: #122019; --muted: #56665d; --rule: #c9d4cd;
  --pylon: #c94a0c; --pylon-fill: #ff6a13; --tv-yellow: #f2c500;
  --turf: #2c6643; --turf-dark: #275b3c; --chalk: rgba(255,255,255,.55);
  --off: #f3f6f3; --def: #17233d; --good: #2a7a4b; --mid: #8a8f4a; --bad: #a8402a; --tint: rgba(201,74,12,.09);
  --track: #d7dfda;
  --f-display: "Saira Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-data: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1511; --surface: #151f19; --ink: #e3ebe6; --muted: #8fa198; --rule: #26342c;
    --pylon: #ff8a45; --pylon-fill: #ff6a13; --tv-yellow: #f5cc1a;
    --turf: #1f4a31; --turf-dark: #1b422b; --chalk: rgba(255,255,255,.4);
    --off: #e9efea; --def: #0b1222; --good: #5fc489; --mid: #c2c27a; --bad: #ef8a6f; --tint: rgba(255,138,69,.12);
    --track: #22302a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1511; --surface: #151f19; --ink: #e3ebe6; --muted: #8fa198; --rule: #26342c;
  --pylon: #ff8a45; --pylon-fill: #ff6a13; --tv-yellow: #f5cc1a;
  --turf: #1f4a31; --turf-dark: #1b422b; --chalk: rgba(255,255,255,.4);
  --off: #e9efea; --def: #0b1222; --good: #5fc489; --mid: #c2c27a; --bad: #ef8a6f; --tint: rgba(255,138,69,.12);
  --track: #22302a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body);
       padding-inline: clamp(16px, 4vw, 48px); padding-block: 24px 64px; }
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 28px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.02; }
.mono, .num { font-family: var(--f-data); font-variant-numeric: tabular-nums; }
.eyebrow { font: 600 11px/1.2 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pylon); outline-offset: 2px; }

header.mast { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 16px 48px; align-items: end; }
header.mast h1 { font-size: clamp(40px, 6.4vw, 80px); font-weight: 800; text-transform: uppercase; }
header.mast h1 span { color: var(--pylon); }
header.mast p { margin: 10px 0 0; max-width: 60ch; }
header.mast .source { font-size: 13px; color: var(--muted); border-left: 1px solid var(--rule); padding-left: 18px; }
header.mast .source b { color: var(--ink); font-weight: 600; }

.teams { display: flex; flex-wrap: wrap; gap: 6px; }
.team { border: 1px solid var(--rule); background: var(--surface); border-radius: 3px; padding: 6px 0; width: 52px; text-align: center;
        font: 700 15px var(--f-display); letter-spacing: .04em; cursor: pointer; }
.team:hover { border-color: var(--ink); }
.team[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.split { display: grid; grid-template-columns: minmax(0, 330px) minmax(0, 1fr); gap: 32px; align-items: start; }
.rail { display: grid; gap: 10px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
#q { width: 100%; border: 1px solid var(--rule); background: var(--surface); padding: 7px 10px; border-radius: 3px; }
.roster { max-height: min(74vh, 860px); overflow-y: auto; border-top: 2px solid var(--ink); }
.unit { font: 700 13px var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 12px 6px 4px; }
.prow { display: grid; grid-template-columns: 2.6em minmax(0, 1fr) auto; gap: 8px; align-items: baseline; width: 100%;
        text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 8px 6px; cursor: pointer; }
.prow:hover, .prow[aria-current="true"] { background: var(--tint); }
.prow[aria-current="true"] .pn { color: var(--pylon); }
.prow .pp { font: 500 12px var(--f-data); color: var(--muted); }
.prow .pn { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .ps { font: 400 12px var(--f-data); color: var(--muted); white-space: nowrap; }

.profile { display: grid; gap: 26px; min-width: 0; }
.who { display: grid; gap: 4px; }
.who h2 { font-size: clamp(36px, 5.4vw, 60px); font-weight: 800; text-transform: uppercase; }
.who .tag { font: 600 14px var(--f-body); color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.lede { font-size: 18px; max-width: 64ch; margin: 0; }
.lede b { font-family: var(--f-data); font-weight: 500; }

.roles { display: grid; gap: 28px; }
.role { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 18px 40px; border-top: 1px solid var(--rule); padding-top: 16px; }
.role h3 { font-size: 26px; font-weight: 700; text-transform: uppercase; grid-column: 1 / -1; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
.role h3 small { font: 500 13px var(--f-body); color: var(--muted); text-transform: none; }
.counts { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 14px 18px; align-content: start; }
.count .num { font-size: 24px; font-weight: 500; display: block; line-height: 1.1; }
.count .lab { font-size: 12px; color: var(--muted); }
.pcts { display: grid; gap: 10px; align-content: start; }
.pct { display: grid; grid-template-columns: minmax(0, 11em) minmax(0, 1fr) 3.4em; gap: 10px; align-items: center; font-size: 13px; }
.pct .track { height: 10px; background: var(--track); border-radius: 2px; position: relative; overflow: hidden; }
.pct .fill { position: absolute; inset: 0 auto 0 0; border-radius: 2px; }
.pct .v { font: 500 13px var(--f-data); text-align: right; }
.pnote { font-size: 12px; color: var(--muted); }

.film { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.fieldbox { display: grid; gap: 10px; min-width: 0; }
.canvaswrap { background: var(--turf-dark); border-radius: 4px; overflow: hidden; display: flex; justify-content: center; }
canvas { display: block; max-width: 100%; visibility: hidden; }
.canvaswrap { min-height: 320px; align-items: center; }
.transport { display: flex; gap: 10px; align-items: center; }
.transport button { border: 1px solid var(--rule); background: var(--surface); border-radius: 3px; padding: 5px 12px; cursor: pointer; font-weight: 600; font-size: 13px; min-width: 70px; }
.transport input[type=range] { flex: 1; min-width: 0; accent-color: var(--pylon-fill); }
.transport .clock { font: 500 13px var(--f-data); min-width: 5.5em; text-align: right; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.plays { display: grid; border-top: 2px solid var(--ink); }
.play { text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 12px 4px; cursor: pointer; display: grid; gap: 4px; }
.play:hover, .play[aria-current="true"] { background: var(--tint); }
.play .ph { font: 600 12px var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.play[aria-current="true"] .ph { color: var(--pylon); }
.play .pt { font: 700 20px var(--f-display); text-transform: uppercase; }
.play .pd { font-size: 14px; }

.log { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font: 600 11px var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--ink); }
td { padding: 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
td.n { font-family: var(--f-data); font-variant-numeric: tabular-nums; white-space: nowrap; }
.foot { font-size: 13px; color: var(--muted); max-width: 80ch; display: grid; gap: 6px; border-top: 1px solid var(--rule); padding-top: 16px; }
.foot b { color: var(--ink); }
.loading { color: var(--muted); padding: 24px 0; }


/* ── player card (FIFA-style) ── */
.top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px 36px; align-items: start; }
.top .intro { display: grid; gap: 16px; min-width: 0; }
.cardbtn { background: none; border: 0; padding: 0; cursor: pointer; display: block; margin-inline: auto; }
.pcard { --c1: #333; --c2: #777; --metal: #d9b45a; --metal2: #fff3c4;
  position: relative; width: 236px; aspect-ratio: 5 / 7.1; max-width: 100%; color: #fff;
  clip-path: polygon(14% 0, 86% 0, 100% 7%, 100% 88%, 50% 100%, 0 88%, 0 7%);
  background: linear-gradient(160deg, var(--metal2) 0%, var(--metal) 18%, var(--metal) 82%, var(--metal2) 100%);
  font-family: var(--f-display); text-align: left; }
.pcard .in { position: absolute; inset: 5px; clip-path: polygon(14% 0, 86% 0, 100% 7%, 100% 88%, 50% 100%, 0 88%, 0 7%); overflow: hidden;
  background: radial-gradient(120% 70% at 70% 30%, var(--c2) 0%, var(--c1) 62%); }
.pcard.tier-elite { --metal: #1d1d1f; --metal2: #d9b45a; }
.pcard.tier-gold { --metal: #d4a83a; --metal2: #fff0b8; }
.pcard.tier-silver { --metal: #a9b1b8; --metal2: #f2f5f7; }
.pcard.tier-bronze { --metal: #a8673a; --metal2: #f0c49c; }
.pcard.tier-none { --metal: #6c7570; --metal2: #b9c2bd; }
.pcard .ovr { position: absolute; left: 12%; top: 9%; display: grid; justify-items: center; line-height: .9; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
.pcard .ovr b { font-size: 3.2em; font-weight: 800; }
.pcard .ovr span { font-size: 1.2em; font-weight: 700; letter-spacing: .04em; }
.pcard .ovr i { font-style: normal; font-size: .9em; font-weight: 700; margin-top: 6px; padding: 1px 5px; border: 1.5px solid currentColor; border-radius: 2px; }
.pcard .face { position: absolute; right: 1%; bottom: 50%; width: 76%; height: auto; filter: drop-shadow(0 4px 6px rgba(0,0,0,.35)); }
.pcard.has-face .jn { opacity: .35; }
.pcard .jn { position: absolute; right: 7%; top: 5%; font-size: 9.4em; font-weight: 800; line-height: 1; letter-spacing: -.04em;
  color: rgba(255,255,255,.1); -webkit-text-stroke: 2px rgba(255,255,255,.85); }
.pcard .nm { position: absolute; left: 0; right: 0; top: 50%; text-align: center; font-size: 1.6em; font-weight: 800; text-transform: uppercase;
  letter-spacing: .02em; padding: 2px 12px; border-block: 1px solid rgba(255,255,255,.35); background: rgba(0,0,0,.18);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pcard .attrs { position: absolute; left: 13%; right: 13%; top: 63%; display: grid; grid-template-columns: 1fr 1fr; gap: 1px 14px; }
.pcard .attrs div { display: flex; gap: 6px; font-size: 1.15em; align-items: baseline; }
.pcard .attrs b { font-weight: 800; min-width: 1.4em; text-align: right; font-variant-numeric: tabular-nums; }
.pcard .attrs span { font-weight: 500; letter-spacing: .04em; opacity: .9; }
.pcard .bio { position: absolute; left: 15%; right: 15%; top: 83%; text-align: center; font: 500 .68em/1.3 var(--f-body); opacity: .9; }
.pcard .shine { position: absolute; inset: 0; background: linear-gradient(105deg, transparent 35%, rgba(255,255,255,.45) 50%, transparent 65%);
  transform: translateX(-120%); pointer-events: none; }
.pcard { font-size: 16px; }
.cardbtn:hover .shine, .cardbtn:focus-visible .shine { animation: shine 1.1s ease; }
.cardhint { font-size: 12px; color: var(--muted); text-align: center; margin-top: 8px; max-width: 236px; margin-inline: auto; }

.pcard .src { position: absolute; left: 0; right: 0; top: 2.2%; text-align: center; font: 700 .52em/1 var(--f-body);
  letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
/* walkout overlay */
.walkout { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: rgba(4,8,6,.9); cursor: pointer; overflow: hidden;
  padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px); perspective: 900px; }
.walkout .stage { display: grid; justify-items: center; gap: 16px; position: relative; }
.walkout .pcard { width: min(330px, 78vw); font-size: min(22px, 5.3vw); }
.walkout .flare { position: absolute; left: 50%; top: 50%; width: 160vmax; height: 160vmax; margin: -80vmax 0 0 -80vmax;
  background: conic-gradient(from 0deg, transparent 0 8%, var(--fl) 10%, transparent 12% 33%, var(--fl) 35%, transparent 37% 58%, var(--fl) 60%, transparent 62% 83%, var(--fl) 85%, transparent 87%);
  opacity: .22; pointer-events: none; }
.walkout .tap { color: #cfd8d2; font: 600 12px var(--f-body); letter-spacing: .14em; text-transform: uppercase; }
.walkout .reveal-meta { color: #fff; font: 700 15px var(--f-body); letter-spacing: .2em; text-transform: uppercase; opacity: .85; }
.walkout.go .flare { animation: spin 14s linear infinite, flarein 1.4s ease both; }
.walkout.go .pcard { animation: reveal 1.3s cubic-bezier(.2,.9,.25,1.12) .55s both; }
.walkout.go .pcard .shine { animation: shine 1s ease 1.8s both; }
.walkout.go .pcard .nm { animation: up .45s ease 1.55s both; }
.walkout.go .pcard .attrs { animation: up .45s ease 1.8s both; }
.walkout.go .pcard .bio { animation: up .45s ease 2s both; }
.walkout.go .reveal-meta { animation: teaser 1.2s ease both; }
.walkout.go .tap { animation: up .4s ease 2.3s both; }
@keyframes reveal { 0% { transform: translateY(30vh) scale(.25) rotateY(720deg); filter: brightness(4); opacity: 0; } 15% { opacity: 1; } 75% { filter: brightness(1.3); } 100% { transform: none; filter: none; } }
@keyframes teaser { 0% { opacity: 0; letter-spacing: .6em; } 40% { opacity: 1; } 100% { opacity: .85; letter-spacing: .2em; } }
@keyframes shine { from { transform: translateX(-120%); } to { transform: translateX(120%); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes flarein { from { opacity: 0; } }
@keyframes up { from { opacity: 0; transform: translateY(8px); } }
@media (max-width: 640px) { .top { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { .walkout.go *, .walkout.go .flare, .cardbtn:hover .shine { animation: none !important; } }


/* replay left, card + match picker right */
.top { grid-template-columns: minmax(0, 1fr) minmax(0, 310px); }
.side { display: grid; gap: 20px; align-content: start; min-width: 0; }
@media (max-width: 1100px) { .top { grid-template-columns: minmax(0, 1fr); } .side { grid-template-columns: minmax(0, 260px) minmax(0, 1fr); align-items: start; } }
@media (max-width: 640px) { .side { grid-template-columns: minmax(0, 1fr); } }
/* match picker */
.picker { display: grid; gap: 10px; min-width: 0; align-content: start; }
.matches { display: grid; max-height: 290px; overflow-y: auto; border-top: 2px solid var(--ink); }
.match { text-align: left; background: none; border: 0; border-bottom: 1px solid var(--rule); padding: 9px 6px; cursor: pointer; display: grid; gap: 2px; }
.match:hover, .match[aria-current="true"] { background: var(--tint); }
.match[aria-current="true"] .mn { color: var(--pylon); }
.match .mw { font: 600 11px/1.2 var(--f-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.match .mn { font: 700 19px/1.1 var(--f-display); text-transform: uppercase; }
.match .ml { font: 400 12px var(--f-data); color: var(--muted); }
.picker .plays { max-height: 360px; overflow-y: auto; }
.play .ph .min { color: var(--pylon); }
.empty { color: var(--muted); font-size: 14px; padding: 12px 4px; }

/* card: name bar, then one flowing block for ratings + bio so nothing overlaps */
.pcard .face { bottom: 54%; width: 70%; right: 3%; }
.pcard .nm { top: 46%; }
.pcard .lower { position: absolute; left: 13%; right: 13%; top: 57.5%; bottom: 11%; display: flex; flex-direction: column; justify-content: space-between; gap: 4px; }
.pcard .lower .attrs { position: static; gap: 0 12px; }
.pcard .lower .attrs div { font-size: 1.02em; line-height: 1.18; }
.pcard .lower .bio { position: static; font-size: .6em; line-height: 1.25; }


/* match dropdown above the replay; plays below it */
.top .intro { align-content: start; }
.matchbar { display: grid; gap: 6px; }
#matchsel { width: 100%; min-width: 0; font: 700 18px/1.2 var(--f-display); letter-spacing: .02em; text-transform: uppercase;
  padding: 10px 40px 10px 12px; border: 1px solid var(--rule); border-radius: 3px; background-color: var(--surface); color: var(--ink);
  appearance: none; -webkit-appearance: none; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--pylon) 50%), linear-gradient(135deg, var(--pylon) 50%, transparent 50%);
  background-position: calc(100% - 20px) 50%, calc(100% - 14px) 50%; background-size: 6px 6px; background-repeat: no-repeat; }
#matchsel:hover { border-color: var(--ink); }
.matchline { font: 400 13px var(--f-data); color: var(--muted); min-height: 1.2em; }
.picker .plays { max-height: none; }
@media (max-width: 1100px) { .side { grid-template-columns: minmax(0, 1fr); justify-items: center; } }

@media (max-width: 980px) {
  header.mast, .split, .film, .role { grid-template-columns: minmax(0, 1fr); }
  header.mast .source { border-left: 0; padding-left: 0; border-top: 1px solid var(--rule); padding-top: 12px; }
  .rail { position: static; }
  .roster { max-height: 360px; }
}
@media (max-width: 480px) { .team { width: calc((100% - 30px) / 6); } .pct { grid-template-columns: minmax(0, 8.5em) minmax(0, 1fr) 3.2em; } }

/* full-width three-column layout: roster | card + percentiles | replay */
.wrap { max-width: 1900px; }
.split { grid-template-columns: minmax(0, 290px) minmax(0, 1fr); gap: 28px; }
.top { grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 28px; }
.side { order: -1; justify-items: stretch; gap: 22px; }
.side .cardbtn { margin-inline: auto; }
.side .roles { gap: 18px; }
.side .role { grid-template-columns: minmax(0, 1fr); gap: 10px; padding-top: 12px; }
.side .role h3 { font-size: 20px; }
.side .pct { grid-template-columns: minmax(0, 9.5em) minmax(0, 1fr) 3em; }
.top .intro { gap: 14px; }
.roster { max-height: calc(100vh - 140px); }
@media (max-width: 1250px) { .top { grid-template-columns: minmax(0, 250px) minmax(0, 1fr); } .side .pcard { width: 100%; } }
@media (max-width: 980px) {
  .split, .top { grid-template-columns: minmax(0, 1fr); }
  .side { position: static; order: 0; }
  .side .pcard { width: 236px; }
  .roster { max-height: 360px; }
}

/* decoys + playback speed */
:root { --decoy: #38c6f4; }
.speeds { display: flex; gap: 4px; }
.spd { border: 1px solid var(--rule); background: var(--surface); border-radius: 3px; padding: 4px 8px; cursor: pointer; font: 600 12px var(--f-data); min-width: 0; }
.spd[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.transport { flex-wrap: wrap; }
.transport .clock { min-width: 9.5em; }
.decoys { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; border-top: 1px solid var(--rule); padding-top: 8px; }
.decoys .dh { font: 600 11px var(--f-body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink); }
.decoys .dc b { color: var(--ink); font-weight: 600; }
.decoys .ds { font-family: var(--f-data); color: var(--ink); }
.decoys .d2 { font: 700 10px var(--f-body); font-style: normal; color: var(--bg); background: var(--decoy); padding: 1px 4px; border-radius: 2px; }

/* card front: big photo, name bar, Madden tag */
.pcard.front .face { bottom: 30%; width: 90%; right: 5%; }
.pcard.front .jn { top: 8%; }
.pcard.front .nm { top: 70%; font-size: 1.75em; }
.pcard.front .src { top: auto; bottom: 15%; font-size: .62em; opacity: .85; }
/* card back: same shape, darker, ratings + bio */
.cardback { display: flex; justify-content: center; }
.pcard.back .in { background: linear-gradient(180deg, color-mix(in srgb, var(--c1) 70%, #000) 0%, color-mix(in srgb, var(--c1) 45%, #000) 100%); }
.pcard.back .bh { position: absolute; top: 4.5%; left: 0; right: 0; text-align: center; font: 700 .55em/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase; opacity: .8; }
.pcard.back .bn { position: absolute; top: 10%; left: 10%; right: 10%; text-align: center; font-size: 1.35em; font-weight: 800; text-transform: uppercase; line-height: 1; }
.pcard.back .ba { position: absolute; top: 17.5%; left: 10%; right: 10%; text-align: center; font: 500 .62em var(--f-body); opacity: .8; }
.pcard.back .battrs { position: absolute; top: 24%; left: 11%; right: 11%; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
.pcard.back .battrs div { display: grid; grid-template-columns: auto 1fr; column-gap: 6px; align-items: baseline; }
.pcard.back .battrs b { font-size: 1.45em; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; grid-row: span 2; }
.pcard.back .battrs span { font-size: .85em; font-weight: 700; letter-spacing: .04em; }
.pcard.back .battrs small { font: 500 .5em/1.1 var(--f-body); opacity: .75; text-transform: lowercase; }
.pcard.back .bbio { position: absolute; top: 62%; left: 15%; right: 15%; margin: 0; display: grid; gap: 2px; font: 500 .62em/1.25 var(--f-body); }
.pcard.back .bbio div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px solid rgba(255,255,255,.15); padding-bottom: 2px; }
.pcard.back .bbio dt { opacity: .7; }
.pcard.back .bbio dd { margin: 0; font-weight: 600; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* percentile sections under the replay */
.roles.under { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px 32px; }
.roles.under .role { grid-template-columns: minmax(0, 1fr); gap: 10px; padding-top: 12px; }
.roles.under .role h3 { font-size: 20px; }
.side { gap: 14px; }
@media (max-width: 1250px) { .side .pcard { width: 100%; } }
@media (max-width: 980px) { .side { grid-template-columns: repeat(2, minmax(0, 236px)); justify-content: center; } .side .pcard { width: 100%; } }
@media (max-width: 520px) { .side { grid-template-columns: minmax(0, 236px); } }

.dnums { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.dnums div { display: grid; }
.dnums b { font: 500 22px var(--f-data); font-variant-numeric: tabular-nums; }
.dnums span { font-size: 12px; color: var(--muted); }
</style>

<div class="wrap">

  <nav class="teams" id="teams" aria-label="Teams"></nav>

  <section class="split">
    <aside class="rail" aria-label="Roster">
      <input id="q" type="search" placeholder="Search all players" aria-label="Search all players">
      <div class="roster" id="roster"></div>
    </aside>
    <article class="profile" id="profile"><div class="loading">Loading 1,679 players…</div></article>
  </section>
</div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const f1 = v => v == null ? "–" : (+v).toFixed(1), f2 = v => v == null ? "–" : (+v).toFixed(2);
const pc = v => v == null ? "–" : Math.round(v * 100) + "%";
const mph = v => v == null ? "–" : (v * 2.04545).toFixed(1);
const int = v => v == null ? "–" : (+v).toLocaleString();
const short = n => { const p = String(n || "").split(" "); return p.length > 1 ? p[0][0] + ". " + p.slice(1).join(" ") : n; };
const ROLE_NAME = { route: "Running routes", rush: "Rushing the passer", block: "Pass blocking", coverage: "In coverage", qb: "Quarterback" };
const ROLE_WHO = { route: "route runners", rush: "pass rushers", block: "pass blockers", coverage: "coverage defenders", qb: "quarterbacks" };
const ROLE_BASE = { route: "routes", rush: "rushes", block: "blocks", coverage: "snaps", qb: "dropbacks" };
const ROLE_ORDER = ["qb", "route", "block", "rush", "coverage"];
const OFF = new Set(["qb", "route", "block"]);

// role -> [ [key, label, formatter], ... ] for counts, and percentile rows [statKey, label, valueFormatter]
const COUNTS = {
  route: [["routes", "routes run", int], ["targets", "targets", int], ["catches", "catches", int], ["yds", "yards", int],
          ["catch_rate", "catch rate", pc], ["sep", "yd avg separation at throw", f1], ["top", "mph top speed", mph]],
  rush: [["rushes", "pass rushes", int], ["pressures", "pressures", int], ["sacks", "sacks", int], ["hits", "QB hits", int],
         ["hurries", "hurries", int], ["pressure_rate", "pressure rate", pc], ["top", "mph top speed", mph]],
  block: [["blocks", "pass blocks", int], ["allowed", "pressures allowed", int], ["sacks_allowed", "sacks allowed", int],
          ["beaten", "times beaten", int], ["allowed_rate", "pressure allowed rate", pc]],
  coverage: [["snaps", "coverage snaps", int], ["near", "yd to nearest receiver at throw", f1], ["targeted", "times targeted", int],
             ["comp", "completions allowed", int], ["yds", "yards allowed", int], ["ints", "interceptions", int], ["top", "mph top speed", mph]],
  qb: [["dropbacks", "dropbacks", int], ["comp", "completions", int], ["att", "attempts", int], ["comp_pct", "completion %", pc],
       ["yds", "passing yards", int], ["sacks", "sacks taken", int], ["ints", "interceptions", int], ["tt", "s avg time to throw", f2]],
};
const PCTS = {
  route: [["sep", "Separation at throw"], ["tgt_share", "Targets per route"], ["yds", "Receiving yards"], ["top", "Top speed"],
          ["decoy_score", "Decoy score"], ["decoy_multi", "Drew 2+ defenders as decoy"]],
  rush: [["pressure_rate", "Pressure rate"], ["pressures", "Total pressures"], ["sacks", "Sacks"], ["top", "Top speed"]],
  block: [["allowed_rate", "Pressure allowed rate"], ["beaten", "Times beaten"]],
  coverage: [["near", "Tight to receivers"], ["comp_allowed", "Completions allowed"], ["ints", "Interceptions"], ["top", "Top speed"]],
  qb: [["comp_pct", "Completion %"], ["yds", "Passing yards"], ["sack_rate", "Avoiding sacks"], ["tt", "Quick release"]],
};

const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const faces = {};
function getFaces(team) {
  if (!faces[team]) faces[team] = fetch(`faces_${team}.json`).then(r => r.ok ? r.json() : {}).catch(() => ({}))
    .then(f => (faces[team] = f));
  return Promise.resolve(faces[team]);
}
let MADDEN = {};
let D, byId = new Map(), film = {}, state = { team: null, player: null, q: "" };

Promise.all([fetch("index.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }),
             fetch("madden.json").then(r => r.ok ? r.json() : {}).catch(() => ({}))])
  .then(([idx, mad]) => { MADDEN = mad; init(idx); }).catch(err => {
  $("#profile").innerHTML = `<p class="loading">Couldn't load index.json (${esc(err.message)}). Serve this folder over HTTP: <span class="mono">python -m http.server 8000</span>.</p>`;
});

function base(p) { const r = p.roles[p.primary]; return r ? r[Object.keys(r)[0]] : 0; }
function snaps(p) { return Object.values(p.roles).reduce((a, r) => a + r[Object.keys(r)[0]], 0); }

const MIN_DECOYS = 20;
const dec = p => p.roles.route || {};
function init(data) {
  D = data;
  D.players = D.players.filter(p => (dec(p).decoys || 0) >= MIN_DECOYS && (dec(p).decoy_real_n || 0) >= 1);
  D.players.forEach(p => { p.primary = "route"; byId.set(p.id, p); });
  const m = D.meta, routes = D.players.reduce((a, p) => a + dec(p).decoys, 0);
  if ($("#source")) $("#source").innerHTML = `<b>${D.players.length} decoys</b> with ${MIN_DECOYS}+ decoy routes, <b>${routes.toLocaleString()}</b> decoy routes in ${m.games} games.<br>Percentiles compare decoys with ${m.decoy_qualify || 40}+ decoy routes.`;
  const teams = [...new Set(D.players.map(p => p.team))].filter(t => t !== "UNK").sort();
  $("#teams").innerHTML = teams.map(t => `<button class="team" data-t="${t}" aria-pressed="false">${t}</button>`).join("");
  $("#teams").querySelectorAll(".team").forEach(b => b.onclick = () => pickTeam(b.dataset.t, true));
  $("#q").oninput = e => { state.q = e.target.value.trim().toLowerCase(); renderRoster(); };
  let start = null;
  const h = location.hash.match(/^#p(\d+)$/);
  if (h) start = byId.get(+h[1]);
  try { if (!start) start = byId.get(+localStorage.getItem("film-player")); } catch (e) {}
  if (!start) start = D.players.find(p => p.name === "Davante Adams") || D.players[0];
  pickTeam(start.team, false);
  selectPlayer(start.id, false);
}

function pickTeam(t, auto) {
  getFaces(t).then(() => { const p = byId.get(state.player); if (p && p.team === t) refreshCard(p); });
  state.team = t; state.q = ""; $("#q").value = "";
  $("#teams").querySelectorAll(".team").forEach(b => b.setAttribute("aria-pressed", b.dataset.t === t));
  renderRoster();
  if (auto) {
    const first = D.players.filter(p => p.team === t).sort((a, b) => dec(b).decoy_score - dec(a).decoy_score)[0];
    if (first) selectPlayer(first.id, false);
  }
}

function rowHTML(p, showTeam) {
  const d = dec(p);
  return `<button class="prow" data-id="${p.id}" aria-current="${p.id === state.player}">
    <span class="pp">${esc(p.pos || "")}</span><span class="pn">${esc(p.name)}</span>
    <span class="ps">${showTeam ? p.team + " · " : ""}score ${f1(d.decoy_score)}</span></button>`;
}

function renderRoster() {
  let html;
  if (state.q) {
    const L = D.players.filter(p => p.name.toLowerCase().includes(state.q)).sort((a, b) => dec(b).decoy_score - dec(a).decoy_score).slice(0, 80);
    html = L.length ? `<div class="unit">${L.length === 80 ? "First 80 matches" : L.length + " match" + (L.length === 1 ? "" : "es")}</div>` + L.map(p => rowHTML(p, true)).join("")
                    : `<p class="loading">No player named “${esc(state.q)}”.</p>`;
  } else {
    const L = D.players.filter(p => p.team === state.team).sort((a, b) => dec(b).decoy_score - dec(a).decoy_score);
    const groups = [["Wide receivers", p => p.pos === "WR"], ["Tight ends", p => p.pos === "TE"],
                    ["Running backs", p => p.pos === "RB" || p.pos === "FB"], ["Others", p => !["WR", "TE", "RB", "FB"].includes(p.pos)]];
    html = groups.map(([label, f]) => { const g = L.filter(f); return g.length ? `<div class="unit">${label}</div>` + g.map(p => rowHTML(p)).join("") : ""; }).join("");
  }
  $("#roster").innerHTML = html;
  $("#roster").querySelectorAll(".prow").forEach(b => b.onclick = () => selectPlayer(+b.dataset.id, true));
}

const ordinal = n => n + (n % 100 >= 11 && n % 100 <= 13 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th");
function pctColor(v) { return v >= 67 ? "var(--good)" : v >= 34 ? "var(--mid)" : "var(--bad)"; }

const TEAM_NAMES = { ARI: "Arizona Cardinals", ATL: "Atlanta Falcons", BAL: "Baltimore Ravens", BUF: "Buffalo Bills",
  CAR: "Carolina Panthers", CHI: "Chicago Bears", CIN: "Cincinnati Bengals", CLE: "Cleveland Browns", DAL: "Dallas Cowboys",
  DEN: "Denver Broncos", DET: "Detroit Lions", GB: "Green Bay Packers", HOU: "Houston Texans", IND: "Indianapolis Colts",
  JAX: "Jacksonville Jaguars", KC: "Kansas City Chiefs", LA: "Los Angeles Rams", LAC: "Los Angeles Chargers", LV: "Las Vegas Raiders",
  MIA: "Miami Dolphins", MIN: "Minnesota Vikings", NE: "New England Patriots", NO: "New Orleans Saints", NYG: "New York Giants",
  NYJ: "New York Jets", PHI: "Philadelphia Eagles", PIT: "Pittsburgh Steelers", SEA: "Seattle Seahawks", SF: "San Francisco 49ers",
  TB: "Tampa Bay Buccaneers", TEN: "Tennessee Titans", WAS: "Washington Football Team" };
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"], MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function niceDate(mdY) { const [m, d, y] = String(mdY).split("/").map(Number); const dt = new Date(Date.UTC(y, m - 1, d));
  return isNaN(dt) ? mdY : `${DAYS[dt.getUTCDay()]} ${d} ${MONTHS[m - 1]}`; }
// game minute like a match clock: Q2 with 8:42 left -> 22'
function matchMinute(q, clock) {
  const [mm, ss] = String(clock || "0:0").split(":").map(Number), left = mm + (ss || 0) / 60;
  const m = q <= 4 ? (q - 1) * 15 + (15 - left) : 60 + (10 - left);
  return Math.max(1, Math.ceil(m));
}
const qLabel = q => q <= 4 ? "Q" + q : "OT";

function gameLine(g) {
  switch (g.role) {
    case "route": return `${g.catches || 0} catches, ${g.yds || 0} yds on ${g.targets || 0} targets`;
    case "rush": return `${g.pressures || 0} pressures${g.sacks ? ", " + g.sacks + " sack" + (g.sacks > 1 ? "s" : "") : ""} on ${g.n} rushes`;
    case "block": return `${g.allowed || 0} pressures allowed in ${g.n} blocks`;
    case "coverage": return `targeted ${g.targeted || 0}, allowed ${g.comp || 0}${g.yds ? " for " + g.yds + " yds" : ""}${g.ints ? ", " + g.ints + " INT" : ""}`;
    case "qb": return `${g.comp || 0}/${g.att || 0}, ${g.yds || 0} yds${g.sacks ? ", sacked " + g.sacks : ""}${g.ints ? ", " + g.ints + " INT" : ""}`;
  }
  return "";
}

function playTitle(q) {
  const m = q.me || {};
  switch (q.role) {
    case "route": return m.decoy_n ? `Real decoy: ${m.decoy_n} defenders on him, pulled ${f1(m.decoy_drag)} yd off the target · score ${Math.round(m.decoy_score)}`
      : m.catch ? `${q.yds}-yard catch` : `Route, ${f1(m.sep)} yd open at the throw`;
    case "qb": return m.comp ? `${q.yds}-yard completion` : m.sack ? "Sacked" : m.int ? "Interception thrown" : "Incomplete pass";
    case "rush": return m.sack ? "Sack" : m.hit ? "QB hit" : m.hurry ? "Hurried the QB" : "Pass rush";
    case "block": return m.allowed ? "Pressure allowed" : m.tt ? `Clean pocket, ${f1(m.tt)} s to throw` : "Clean rep";
    case "coverage": return m.int ? "Interception" : m.targeted && !m.comp ? "Pass defended" : m.targeted ? `Allowed a ${q.yds}-yard catch` : `In coverage, ${f1(m.near)} yd from nearest receiver`;
  }
  return "";
}

function cardHint(p) {
  const m = MADDEN[p.id];
  if (!m || !m.ovr) return "Not on a Madden NFL 22 roster, so the card shows his real 2021 numbers from this data (weeks 1–8). Tap the card to open it.";
  const move = m.launch && m.wk8 && m.launch !== m.wk8 ? ` Rated ${m.launch} at launch, ${m.wk8} by week 8.` : "";
  return `Overall and ratings: EA Madden NFL 22, ${m.wk8 ? "week 8 update" : "launch ratings"} (${esc(m.mpos)}${m.arch ? ", " + esc(m.arch.replace(/_/g, " ").replace(/^\w+ /, "")) : ""}).${move} Tap the card to open it.`;
}

function refreshCard(p) {
  const b = $("#cardbtn"); if (b && state.player === p.id) b.innerHTML = cardHTML(p);
}

function selectPlayer(id, scroll) {
  const p = byId.get(id); if (!p) return;
  state.player = id;
  if (p.team !== state.team && !state.q) pickTeam(p.team, false);
  document.querySelectorAll(".prow").forEach(r => r.setAttribute("aria-current", +r.dataset.id === id));
  try { history.replaceState(null, "", "#p" + id); localStorage.setItem("film-player", id); } catch (e) {}
  const roles = ROLE_ORDER.filter(r => p.roles[r]).sort((a, b) => (b === p.primary) - (a === p.primary));
  $("#profile").innerHTML = `
    <div class="top">
      <div class="intro">
        <div class="who">
          <div class="tag">${p.num != null ? "#" + p.num + " · " : ""}${esc(p.pos || "")} · ${esc(TEAM_NAMES[p.team] || p.team)} · Decoy</div>
          <h2>${esc(p.name)}</h2>
        </div>
        <div class="matchbar">
          <label class="eyebrow" for="matchsel">Match</label>
          <select id="matchsel" disabled><option>Loading his games…</option></select>
          <div class="matchline" id="matchline"></div>
        </div>
          <div class="fieldbox">
            <div class="canvaswrap"><canvas id="field" role="img" aria-label="Overhead replay of the selected play"></canvas></div>
            <div class="transport"><button id="playbtn" type="button">Pause</button>
              <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Play timeline"><span class="clock" id="clock">loading</span>
              <span class="speeds" role="group" aria-label="Playback speed">${[[1, "1×"], [0.5, "½×"], [0.25, "¼×"]].map(([r, l]) =>
                `<button type="button" class="spd" data-r="${r}" aria-pressed="${r === playRate}">${l}</button>`).join("")}</span></div>
            <div class="legend"><span><i style="background:var(--pylon-fill)"></i>${esc(short(p.name))}</span>
              <span><i style="background:var(--tv-yellow)"></i>Target</span>
              <span><i style="background:transparent;outline:2.5px solid var(--decoy)"></i>Defenders he baited</span>
              <span><i style="background:var(--off)"></i>Offense</span>
              <span><i style="background:var(--def);outline:1px solid var(--chalk)"></i>Defense</span></div>
            <div class="decoys" id="decoys"></div>
          </div>
        <div class="picker">
          <div class="eyebrow" id="playshead">Plays</div>
          <div class="plays" id="plays"></div>
        </div>
      </div>
      <div class="side">
        <div><button class="cardbtn" id="cardbtn" type="button" aria-label="Open the card for ${esc(p.name)}">${cardHTML(p)}</button></div>
        <div class="cardback">${cardBackHTML(p)}</div>
        <div class="roles">${decoyHTML(p)}</div>
      </div>
    </div>`;
  $("#cardbtn").onclick = () => walkout(p);
  document.querySelectorAll(".spd").forEach(b => b.onclick = () => {
    playRate = +b.dataset.r; anim.last = 0;
    document.querySelectorAll(".spd").forEach(x => x.setAttribute("aria-pressed", x === b));
    try { localStorage.setItem("film-rate", playRate); } catch (e) {}
  });
  getFaces(p.team).then(() => refreshCard(p));
  getFilm(p.team).then(F => { if (state.player === p.id) renderMatches(p, (F.plays || {})[p.id] || []); })
    .catch(() => { $("#matchsel").innerHTML = `<option>Couldn't load the replays for ${esc(p.team)}</option>`; });
  if (scroll && window.matchMedia("(max-width: 980px)").matches) $("#profile").scrollIntoView({ behavior: "smooth", block: "start" });
}

function renderMatches(p, plays) {
  const byGame = {};
  p.games.filter(g => g.decoy && g.decoy.real > 0).forEach(g => { byGame[g.gameId] = { ...g, lines: [
    `${g.decoy.real} real decoy play${g.decoy.real === 1 ? "" : "s"} in ${g.decoy.n} decoy routes · best score ${Math.round(g.decoy.best)}`] }; });
  const games = Object.values(byGame).sort((a, b) => a.week - b.week);
  const best = plays.filter(q => q.best);
  const what = "real decoy plays";
  const items = [{ week: null, label: `Season best · his top ${best.length} ${what}, weeks 1–8`,
                   sub: "2+ defenders on him at the throw, pulled away from the target · ranked by decoy score", plays: best }]
    .concat(games.map(g => ({ week: g.week,
      label: `Week ${g.week} · ${niceDate(g.date)} · ${TEAM_NAMES[p.team] || p.team} vs ${TEAM_NAMES[g.opp] || g.opp}`,
      sub: `${g.home ? "Home" : "Away"} · ${g.lines.join(" · ")}`,
      plays: plays.filter(q => String(q.gameId) === String(g.gameId)) })));
  const sel = $("#matchsel");
  sel.innerHTML = items.map((m, i) => `<option value="${i}">${esc(m.label)}</option>`).join("");
  sel.disabled = false;
  const pick = i => { $("#matchline").textContent = items[i].sub; renderPlays(p, items[i]); };
  sel.onchange = () => pick(+sel.value);
  pick(0);
}

function renderPlays(p, m) {
  $("#playshead").textContent = m.week ? `His real decoy play · week ${m.week}` : "His best real decoy plays · season";
  if (!m.plays.length) {
    $("#plays").innerHTML = `<p class="empty">${p.primary === "route" ? "He didn't draw a defender as a decoy in this match." : "No replay saved for this match."}</p>`;
    return;
  }
  $("#plays").innerHTML = m.plays.map((q, i) => `
    <button class="play" data-i="${i}" aria-current="${i === 0}">
      <span class="ph">${m.week ? "" : `Wk ${q.week} vs ${esc(q.off === p.team ? q.dff : q.off)} · `}${qLabel(q.q)} ${esc(q.clock)} left · <span class="min">${matchMinute(q.q, q.clock)}'</span> · ${q.down}&amp;${q.togo}</span>
      <span class="pt">${esc(playTitle(q))}</span>
      <span class="pd">${esc(q.desc.replace(/^\([^)]*\)\s*/, "").slice(0, 170))}</span>
    </button>`).join("");
  $("#plays").querySelectorAll(".play").forEach(b => b.onclick = () => {
    $("#plays").querySelectorAll(".play").forEach(x => x.setAttribute("aria-current", x === b));
    loadPlay(p, m.plays[+b.dataset.i]);
  });
  loadPlay(p, m.plays[0]);
}

function decoyHTML(p) {
  const d = dec(p);
  const bars = [["decoy_score", "Decoy score"], ["decoy_drawn", "Defenders drawn per route"], ["decoy_multi", "Drew 2+ defenders"]]
    .filter(([k]) => d["p_" + k] != null);
  return `<section class="role">
    <h3>As a decoy <small>${d.decoys} decoy routes</small></h3>
    <div class="dnums">
      <div><b>${f1(d.decoy_score)}</b><span>avg score</span></div>
      <div><b>${f1(d.decoy_best)}</b><span>best score</span></div>
      <div><b>${f2(d.decoy_drawn)}</b><span>defenders per route</span></div>
      <div><b>${d.decoy_real_n}</b><span>real decoy plays</span></div>
    </div>
    <div class="pcts">${bars.length ? bars.map(([k, lab]) => { const v = d["p_" + k]; return `<div class="pct"><span>${lab}</span>
      <span class="track"><span class="fill" style="width:${Math.max(v, 2)}%;background:${pctColor(v)}"></span></span><span class="v">${ordinal(v)}</span></div>`; }).join("")
      + `<p class="pnote">Percentile among decoys with ${D.meta.decoy_qualify || 40}+ decoy routes.</p>`
      : `<p class="pnote">Needs ${D.meta.decoy_qualify || 40}+ decoy routes for percentiles (has ${d.decoys}).</p>`}</div>
  </section>`;
}

function roleHTML(p, role) {
  const x = p.roles[role], n = x[Object.keys(x)[0]];
  const pcts = PCTS[role].filter(([k]) => x["p_" + k] != null);
  return `<section class="role">

let anim = { raf: 0, t: 0, playing: false, last: 0, play: null };

async function getFilm(team) {
  if (!film[team]) film[team] = fetch(`film_${team}.json`).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
  return film[team];

async function loadPlay(p, q) {
  cancelAnimationFrame(anim.raf);
  let F;
  try { F = (await getFilm(p.team)).frames[q.key]; } catch (e) { F = null; }
  if (state.player !== p.id) return;
  if (!F) { $("#clock").textContent = "film unavailable"; return; }
  const frames = F.frames.map(f => { const pos = new Map();
    F.ids.forEach((id, i) => { const x = f[1 + 2 * i], y = f[2 + 2 * i]; if (x >= 0) pos.set(id, [x / 10, y / 10]); });
    return { t: f[0] / 10, pos }; });
  const end = frames[frames.length - 1].t, keyT = F.key / 10;
  let xmin = 1e9, xmax = -1e9;
  frames.forEach(f => f.pos.forEach(([x], id) => { if (id) { xmin = Math.min(xmin, x); xmax = Math.max(xmax, x); } }));
  const los = (frames[0].pos.get(0) || [xmin + 8])[0];
  const m = q.me || {};
  const decoys = m.decoy_ids ? [{ id: p.id, att: m.decoy_ids, n: m.decoy_n, raw: m.decoy_raw, tm: m.decoy_tm || 0,
      score: m.decoy_score, pull: m.decoy_n ? m.decoy_raw / m.decoy_n : 0, radius: Math.max(DECOY_YDS, (m.decoy_radius || 0) + 0.6) }]
    : findDecoys(F, frames, keyT, q.target);
  const t0 = frames[0].t;
  anim = { raf: 0, t: reduce ? keyT : t0, playing: !reduce, last: 0, held: false, hold: 0,
           play: { p, q, F, frames, end, keyT, t0, decoys, x0: Math.floor(xmin - 3), x1: Math.ceil(xmax + 3), los, fd: los + (q.togo || 0) } };

    anim.playing = !anim.playing; $("#playbtn").textContent = anim.playing ? "Pause" : "Play"; anim.last = 0; tick(); };

/* Decoy Efficiency, as briefed: at the throw, every route runner who is not the target is a decoy.
   Count coverage defenders within 5 yd of him (not also within 5 yd of the target) and multiply
   that count by their distance from the target: score = sum of those distances, in yards.
   Invisible zone: the same 5 yd around him; each teammate inside it divides the score by one more,
   because those defenders may be there for the teammate. */

  const T = fr.pos.get(target); if (!T) return [];
  const d = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  const covs = [...fr.pos.keys()].filter(id => F.roles[id] === "coverage" && d(fr.pos.get(id), T) >= DECOY_YDS);
  const mates = [...fr.pos.keys()].filter(id => F.roles[id] === "route" || F.roles[id] === "block");
  return [...fr.pos.keys()].filter(id => F.roles[id] === "route" && id !== target).map(id => {
    const me = fr.pos.get(id), att = covs.filter(c => d(fr.pos.get(c), me) < DECOY_YDS);
    const dists = att.map(c => d(fr.pos.get(c), T));
    const raw = dists.reduce((a, b) => a + b, 0);
    const tm = mates.filter(m => m !== id && d(fr.pos.get(m), me) < DECOY_YDS).length;   // the invisible zone
    return { id, att, n: att.length, pull: dists.length ? raw / dists.length : 0, raw, tm, score: raw / (1 + tm) };

  const live = decoys.filter(x => x.n);
  el.innerHTML = `<span class="dh">His decoy work at the throw</span> ` + (live.length
    ? live.map(x => `<span class="dc"><b>${esc(short(D.names[x.id] || ""))}</b> baited ${(x.att || []).map(c => esc(short(D.names[c] || ""))).join(", ")}: ${x.n} defender${x.n > 1 ? "s" : ""} × ${f1(x.pull)} yd from target = ${f1(x.raw)}${x.tm
        ? `, ÷ ${1 + x.tm} for ${x.tm} teammate${x.tm > 1 ? "s" : ""} in his zone` : ", no teammates in his zone"} → score <b class="ds">${f1(x.score)}</b>${x.n >= 2 ? ' <i class="d2">2+</i>' : ""}</span>`).join("")

  c.width = Math.round(w * dpr); c.height = Math.round(h * dpr); c.style.width = w + "px"; c.style.height = h + "px";

function tick(ts) {

    anim.last = ts || 0;

    else anim.t += dt * playRate;                                         // tracking is 10 Hz: 1× is real time

  g.font = `600 ${Math.max(11 * dpr, s * 1.25)}px ${tok("--f-body")}`; g.textAlign = "left"; g.textBaseline = "middle";
  const label = (id, txt, col) => { const p = pos.get(id); if (!p) return; const tx = X(p[1]) + r + 4 * dpr, ty = Y(p[0]);
    g.lineWidth = 3 * dpr; g.strokeStyle = "rgba(0,0,0,.6)"; g.strokeText(txt, tx, ty); g.fillStyle = col; g.fillText(txt, tx, ty); };
  label(me, short(P.p.name), "#fff");
  if (atKey) live.forEach(x => { if (x.id !== me) label(x.id, `${short(D.names[x.id] || "")} · decoy ×${x.n} · ${Math.round(x.score)}`, decoyCol);
                                 else label(me, `${short(P.p.name)} · decoy ×${x.n} · ${Math.round(x.score)}`, decoyCol); });
  if (tgt && tgt !== me && P.F.thrown) label(tgt, short(D.names[tgt] || "") + " · target", tok("--tv-yellow"));
  if (atKey) { g.font = `800 ${Math.max(14 * dpr, s * 2.2)}px ${tok("--f-display")}`; g.textAlign = "left"; g.textBaseline = "top";
    g.fillStyle = "#fff"; g.fillText(P.F.thrown ? "THROW" : (P.q.result === "S" ? "SACK" : "END OF PLAY"), 8 * dpr, 8 * dpr); }
  // his real speed right now, from the two tracking frames around t
  const fr = P.frames, j = Math.max(1, Math.min(fr.length - 1, fr.findIndex(f => f.t > anim.t)));
  const pa = fr[j - 1].pos.get(me), pb = fr[j].pos.get(me);
  const v = pa && pb && fr[j].t > fr[j - 1].t ? Math.hypot(pb[0] - pa[0], pb[1] - pa[1]) / (fr[j].t - fr[j - 1].t) : null;
  $("#clock").textContent = `${anim.t.toFixed(1)} s${atKey ? (P.F.thrown ? " · throw" : "") : ""}${v != null ? ` · ${(v * 2.04545).toFixed(0)} mph` : ""}`;
  $("#scrub").value = Math.round((anim.t - P.t0) / (P.end - P.t0) * 1000);
}

window.addEventListener("resize", () => { clearTimeout(window._rs); window._rs = setTimeout(sizeCanvas, 120); });
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
new MutationObserver(draw).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
</script>
